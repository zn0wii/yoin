[package]
name = "yoin"
version = "0.1.0"
description = "Yoin — a vinyl-inspired album player"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yoin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"

encoding_rs = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
urlencoding = "2.1.3"
num-bigint-dig = "0.9.1"
num-traits = "0.2.19"
base64 = "0.23.1"
hex = "0.4.3"
md5 = "0.8.1"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
rand = "0.8"
ecb = "0.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
